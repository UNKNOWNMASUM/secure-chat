<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Secure Chat</title>
<link rel="manifest" href="/static/manifest.json" />
<meta name="theme-color" content="#17181a" />
<link rel="icon" href="/icon-192.png" />
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #17181a;
    --card-bg: #232427;
    --text: #e8e8e8;
    --muted-text: #9a9a9a;
    --input-bg: #1c1d20;
    --border: #3a3b3e;
    --accent: #f97316;
    --accent-hover: #ea6a0c;
    --accent-text: #17181a;
    --bubble-theirs: #3a3b3e;
    --shadow: rgba(0,0,0,0.4);
    --seen-tick: #38bdf8;
  }

  html[data-theme="light"] {
    --bg: #eceded;
    --card-bg: #ffffff;
    --text: #232427;
    --muted-text: #6b6b6b;
    --input-bg: #f2f2f3;
    --border: #d6d7d9;
    --accent: #f97316;
    --accent-hover: #ea6a0c;
    --accent-text: #ffffff;
    --bubble-theirs: #e5e6e8;
    --shadow: rgba(0,0,0,0.12);
    --seen-tick: #0284c7;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, color 0.2s;
  }
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 30px var(--shadow);
    position: relative;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 16px;
    color: var(--accent);
  }
  input, button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 15px;
  }
  input {
    background: var(--input-bg);
    color: var(--text);
  }
  button {
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
    border: none;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  .error { color: #f87171; font-size: 14px; margin-top: 6px; min-height: 18px; }
  .switch { text-align: center; margin-top: 10px; font-size: 14px; color: var(--muted-text); }
  .switch a { color: var(--accent); cursor: pointer; text-decoration: underline; }

  #listView, #chatView { display: none; width: 100%; max-width: 500px; }

  /* --- Chat list screen --- */
  #convList {
    max-height: 60vh;
    overflow-y: auto;
    margin-top: 6px;
  }
  .conv-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 6px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .conv-item:hover { background: var(--input-bg); }
  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 17px;
    flex-shrink: 0;
  }
  .conv-info { flex: 1; min-width: 0; }
  .conv-top-row { display: flex; justify-content: space-between; align-items: baseline; }
  .conv-name { font-weight: 600; font-size: 15px; }
  .conv-time { font-size: 11px; color: var(--muted-text); flex-shrink: 0; margin-left: 6px; }
  .conv-preview {
    font-size: 13px;
    color: var(--muted-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .unread-badge {
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    margin-left: 6px;
    flex-shrink: 0;
  }
  .empty-hint { color: var(--muted-text); font-size: 14px; text-align: center; padding: 24px 0; }

  /* --- Chat conversation screen --- */
  #messages {
    background: var(--input-bg);
    border-radius: 8px;
    padding: 12px;
    height: 320px;
    overflow-y: auto;
    margin-bottom: 10px;
  }
  .msg { margin: 6px 0; padding: 8px 12px; border-radius: 8px; max-width: 75%; word-wrap: break-word; }
  .msg.mine { background: var(--accent); color: var(--accent-text); margin-left: auto; }
  .msg.theirs { background: var(--bubble-theirs); color: var(--text); }
  .msg small { display: flex; align-items: center; gap: 4px; font-size: 11px; opacity: 0.85; margin-top: 2px; }
  .ticks { font-size: 13px; letter-spacing: -2px; }
  .ticks.seen { color: var(--seen-tick); opacity: 1; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  .row button { width: auto; padding: 12px 18px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .topbar button { width: auto; background: var(--bubble-theirs); color: var(--text); padding: 8px 14px; flex-shrink: 0; }
  .back-btn {
    background: none !important;
    border: none;
    color: var(--text);
    font-size: 20px;
    padding: 4px 8px !important;
    cursor: pointer;
    width: auto !important;
  }
  .chat-title { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .theme-toggle {
    position: absolute;
    top: 16px;
    right: 16px;
    width: auto;
    margin: 0;
    padding: 6px 12px;
    font-size: 12px;
    white-space: nowrap;
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .theme-toggle:hover { background: var(--bubble-theirs); }
</style>
</head>
<body>

<div class="card" id="authView">
  <button class="theme-toggle" id="themeToggle">🌙</button>
  <h1 id="authTitle">Sign in</h1>
  <input type="text" id="username" placeholder="Username" autocomplete="username" style="display:none;" />
  <input type="text" id="email" placeholder="Email or phone number" autocomplete="email" />
  <input type="tel" id="phone" placeholder="Phone number (optional)" autocomplete="tel" style="display:none;" />
  <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
  <button id="authSubmit">Sign in</button>
  <div class="error" id="authError"></div>
  <div class="switch">
    <span id="switchText">No account? <a id="switchLink">Sign up</a></span>
  </div>
</div>

<div class="card" id="listView">
  <button class="theme-toggle" id="themeToggleList">🌙</button>
  <div class="topbar">
    <div id="whoami"></div>
    <button id="logoutBtnList">Log out</button>
  </div>
  <input type="text" id="convSearch" placeholder="Search chats or find someone..." autocomplete="off" />
  <div id="convList"></div>
</div>

<div class="card" id="chatView">
  <button class="theme-toggle" id="themeToggleChat">🌙</button>
  <div class="topbar">
    <div class="topbar-left">
      <button class="back-btn" id="backBtn">←</button>
      <div class="chat-title" id="chatTitle"></div>
    </div>
    <button id="logoutBtn">Log out</button>
  </div>
  <div id="messages"></div>
  <div class="row">
    <input type="text" id="messageText" placeholder="Type a message..." />
    <button id="sendBtn">Send</button>
  </div>
  <div class="error" id="chatError"></div>
</div>

<script>
const API = "";
let token = null;
let myEmail = null;
let myUsername = null;
let isSignup = false;
let pollTimer = null;
let listPollTimer = null;
let currentRecipient = null; // email of the person we're chatting with

const authView = document.getElementById("authView");
const listView = document.getElementById("listView");
const chatView = document.getElementById("chatView");
const authTitle = document.getElementById("authTitle");
const authSubmit = document.getElementById("authSubmit");
const authError = document.getElementById("authError");
const switchText = document.getElementById("switchText");
const switchLink = document.getElementById("switchLink");

// --- Theme (dark / light) ---
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const label = theme === "light" ? "☀️ Normal Mode" : "🌙 Dark Mode";
  document.getElementById("themeToggle").textContent = label;
  document.getElementById("themeToggleList").textContent = label;
  document.getElementById("themeToggleChat").textContent = label;
  localStorage.setItem("secureChatTheme", theme);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
  applyTheme(current === "light" ? "dark" : "light");
}

document.getElementById("themeToggle").addEventListener("click", toggleTheme);
document.getElementById("themeToggleList").addEventListener("click", toggleTheme);
document.getElementById("themeToggleChat").addEventListener("click", toggleTheme);

(function initTheme() {
  const saved = localStorage.getItem("secureChatTheme");
  if (saved) {
    applyTheme(saved);
  } else {
    const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
    applyTheme(prefersLight ? "light" : "dark");
  }
})();

function toggleAuthMode() {
  isSignup = !isSignup;
  authTitle.textContent = isSignup ? "Sign up" : "Sign in";
  authSubmit.textContent = isSignup ? "Sign up" : "Sign in";
  document.getElementById("username").style.display = isSignup ? "block" : "none";
  document.getElementById("phone").style.display = isSignup ? "block" : "none";
  document.getElementById("email").placeholder = isSignup ? "Email" : "Email or phone number";
  switchText.innerHTML = isSignup
    ? 'Have an account? <a id="switchLink">Sign in</a>'
    : 'No account? <a id="switchLink">Sign up</a>';
  document.getElementById("switchLink").addEventListener("click", toggleAuthMode);
  authError.textContent = "";
}

switchLink.addEventListener("click", toggleAuthMode);

async function handleAuthSubmit() {
  const email = document.getElementById("email").value.trim();
  const username = document.getElementById("username").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;
  authError.textContent = "";

  if (!email || !password || (isSignup && !username)) {
    authError.textContent = isSignup
      ? "Please enter username, email and password."
      : "Please enter your email/phone and password.";
    return;
  }

  try {
    let res, data;
    if (isSignup) {
      res = await fetch("/api/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, username, phone: phone || null, password }),
      });
    } else {
      const form = new URLSearchParams();
      form.append("username", email); // holds email OR phone typed by the user
      form.append("password", password);
      res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: form,
      });
    }
    data = await res.json();
    if (!res.ok) {
      authError.textContent = data.detail || "Something went wrong.";
      return;
    }
    token = data.access_token;
    myEmail = data.email;
    myUsername = data.username;
    localStorage.setItem("secureChatToken", token);
    localStorage.setItem("secureChatEmail", myEmail);
    localStorage.setItem("secureChatUsername", myUsername);
    showList();
  } catch (err) {
    authError.textContent = "Network error. Please try again.";
  }
}

authSubmit.addEventListener("click", handleAuthSubmit);
document.getElementById("password").addEventListener("keydown", (e) => {
  if (e.key === "Enter") handleAuthSubmit();
});

function doLogout() {
  token = null;
  myEmail = null;
  myUsername = null;
  currentRecipient = null;
  localStorage.removeItem("secureChatToken");
  localStorage.removeItem("secureChatEmail");
  localStorage.removeItem("secureChatUsername");
  clearInterval(pollTimer);
  clearInterval(listPollTimer);
  chatView.style.display = "none";
  listView.style.display = "none";
  authView.style.display = "block";
}
document.getElementById("logoutBtn").addEventListener("click", doLogout);
document.getElementById("logoutBtnList").addEventListener("click", doLogout);

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function initials(name) {
  return (name || "?").trim().charAt(0).toUpperCase();
}

function formatTime(iso) {
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString([], { month: "short", day: "numeric" });
}

// ---------------------------------------------------------------------
// Chat LIST screen
// ---------------------------------------------------------------------

function showList() {
  authView.style.display = "none";
  chatView.style.display = "none";
  listView.style.display = "block";
  document.getElementById("whoami").textContent = myUsername || myEmail;
  clearInterval(pollTimer);
  loadConversations();
  clearInterval(listPollTimer);
  listPollTimer = setInterval(() => {
    if (!document.getElementById("convSearch").value.trim()) loadConversations();
  }, 4000);
}

async function loadConversations() {
  try {
    const res = await fetch("/api/conversations", {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (!res.ok) return;
    const data = await res.json();
    renderConvList(data);
  } catch (err) {
    // silent fail on background poll
  }
}

function renderConvList(conversations) {
  const box = document.getElementById("convList");
  box.innerHTML = "";
  if (conversations.length === 0) {
    box.innerHTML = '<div class="empty-hint">No chats yet. Search a username or email above to start one.</div>';
    return;
  }
  conversations.forEach((c) => {
    const item = document.createElement("div");
    item.className = "conv-item";
    const isMine = c.last_sender_email === myEmail;
    const tickHtml = isMine
      ? `<span class="ticks ${c.last_message_read ? 'seen' : ''}">${c.last_message_read ? '✓✓' : '✓'}</span>`
      : "";
    item.innerHTML = `
      <div class="avatar">${initials(c.username)}</div>
      <div class="conv-info">
        <div class="conv-top-row">
          <div class="conv-name">${escapeHtml(c.username)}</div>
          <div class="conv-time">${formatTime(c.last_time)}</div>
        </div>
        <div class="conv-preview">${tickHtml}<span>${escapeHtml(c.last_message)}</span>
          ${c.unread_count > 0 ? `<span class="unread-badge">${c.unread_count}</span>` : ""}
        </div>
      </div>
    `;
    item.addEventListener("click", () => openChat(c.email, c.username));
    box.appendChild(item);
  });
}

let searchDebounce = null;
document.getElementById("convSearch").addEventListener("input", (e) => {
  const q = e.target.value.trim();
  clearTimeout(searchDebounce);
  if (!q) {
    loadConversations();
    return;
  }
  searchDebounce = setTimeout(() => runSearch(q), 300);
});

async function runSearch(q) {
  try {
    const res = await fetch(`/api/users/search?q=${encodeURIComponent(q)}`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    const data = await res.json();
    const box = document.getElementById("convList");
    box.innerHTML = "";
    if (!res.ok || data.length === 0) {
      box.innerHTML = '<div class="empty-hint">No matching users found.</div>';
      return;
    }
    data.forEach((u) => {
      const item = document.createElement("div");
      item.className = "conv-item";
      item.innerHTML = `
        <div class="avatar">${initials(u.username)}</div>
        <div class="conv-info">
          <div class="conv-top-row"><div class="conv-name">${escapeHtml(u.username)}</div></div>
          <div class="conv-preview">${escapeHtml(u.email)}</div>
        </div>
      `;
      item.addEventListener("click", () => openChat(u.email, u.username));
      box.appendChild(item);
    });
  } catch (err) {
    // ignore
  }
}

// ---------------------------------------------------------------------
// Chat CONVERSATION screen
// ---------------------------------------------------------------------

function openChat(email, username) {
  currentRecipient = email;
  document.getElementById("chatTitle").textContent = username || email;
  document.getElementById("convSearch").value = "";
  listView.style.display = "none";
  chatView.style.display = "block";
  clearInterval(listPollTimer);
  loadMessages();
  clearInterval(pollTimer);
  pollTimer = setInterval(loadMessages, 3000);
}

document.getElementById("backBtn").addEventListener("click", () => {
  clearInterval(pollTimer);
  currentRecipient = null;
  showList();
});

async function loadMessages() {
  const chatError = document.getElementById("chatError");
  if (!currentRecipient) return;

  try {
    const res = await fetch(`/api/messages/${encodeURIComponent(currentRecipient)}`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    const data = await res.json();
    if (!res.ok) {
      chatError.textContent = data.detail || "Could not load messages.";
      return;
    }
    chatError.textContent = "";
    const box = document.getElementById("messages");
    box.innerHTML = "";
    data.forEach((m) => {
      const div = document.createElement("div");
      const mine = m.sender_email === myEmail;
      div.className = "msg " + (mine ? "mine" : "theirs");
      const time = new Date(m.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const tickHtml = mine
        ? `<span class="ticks ${m.is_read ? 'seen' : ''}">${m.is_read ? '✓✓' : '✓'}</span>`
        : "";
      div.innerHTML = `${escapeHtml(m.text)}<small>${tickHtml}<span>${time}</span></small>`;
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  } catch (err) {
    chatError.textContent = "Network error loading messages.";
  }
}

document.getElementById("sendBtn").addEventListener("click", sendMessage);
document.getElementById("messageText").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});

async function sendMessage() {
  const text = document.getElementById("messageText").value.trim();
  const chatError = document.getElementById("chatError");
  if (!currentRecipient) {
    chatError.textContent = "Open a chat first.";
    return;
  }
  if (!text) return;

  try {
    const res = await fetch("/api/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`,
      },
      body: JSON.stringify({ receiver_email: currentRecipient, text }),
    });
    const data = await res.json();
    if (!res.ok) {
      chatError.textContent = data.detail || "Could not send message.";
      return;
    }
    document.getElementById("messageText").value = "";
    chatError.textContent = "";
    loadMessages();
  } catch (err) {
    chatError.textContent = "Network error sending message.";
  }
}

// Auto-login if a token is already stored
window.addEventListener("load", () => {
  const savedToken = localStorage.getItem("secureChatToken");
  const savedEmail = localStorage.getItem("secureChatEmail");
  const savedUsername = localStorage.getItem("secureChatUsername");
  if (savedToken && savedEmail) {
    token = savedToken;
    myEmail = savedEmail;
    myUsername = savedUsername;
    showList();
  }
});
</script>
</body>
</html>
