<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Secure Chat</title>
<link rel="manifest" href="/static/manifest.json" />
<meta name="theme-color" content="#17181a" />
<link rel="icon" href="/icon-192.png" />
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #17181a;
    --card-bg: #232427;
    --text: #e8e8e8;
    --muted-text: #9a9a9a;
    --input-bg: #1c1d20;
    --border: #3a3b3e;
    --accent: #f97316;
    --accent-hover: #ea6a0c;
    --accent-text: #17181a;
    --bubble-theirs: #3a3b3e;
    --shadow: rgba(0,0,0,0.4);
  }

  html[data-theme="light"] {
    --bg: #eceded;
    --card-bg: #ffffff;
    --text: #232427;
    --muted-text: #6b6b6b;
    --input-bg: #f2f2f3;
    --border: #d6d7d9;
    --accent: #f97316;
    --accent-hover: #ea6a0c;
    --accent-text: #ffffff;
    --bubble-theirs: #e5e6e8;
    --shadow: rgba(0,0,0,0.12);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, color 0.2s;
  }
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 30px var(--shadow);
    position: relative;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 16px;
    color: var(--accent);
  }
  input, button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 15px;
  }
  input {
    background: var(--input-bg);
    color: var(--text);
  }
  button {
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
    border: none;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  .error { color: #f87171; font-size: 14px; margin-top: 6px; min-height: 18px; }
  .switch { text-align: center; margin-top: 10px; font-size: 14px; color: var(--muted-text); }
  .switch a { color: var(--accent); cursor: pointer; text-decoration: underline; }

  #chatView { display: none; width: 100%; max-width: 500px; }
  #messages {
    background: var(--input-bg);
    border-radius: 8px;
    padding: 12px;
    height: 320px;
    overflow-y: auto;
    margin-bottom: 10px;
  }
  .msg { margin: 6px 0; padding: 8px 12px; border-radius: 8px; max-width: 75%; word-wrap: break-word; }
  .msg.mine { background: var(--accent); color: var(--accent-text); margin-left: auto; }
  .msg.theirs { background: var(--bubble-theirs); color: var(--text); }
  .msg small { display: block; font-size: 11px; opacity: 0.7; margin-top: 2px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  .row button { width: auto; padding: 12px 18px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .topbar button { width: auto; background: var(--bubble-theirs); color: var(--text); padding: 8px 14px; }

  .theme-toggle {
    position: absolute;
    top: 16px;
    right: 16px;
    width: auto;
    margin: 0;
    padding: 6px 12px;
    font-size: 12px;
    white-space: nowrap;
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .theme-toggle:hover { background: var(--bubble-theirs); }
</style>
</head>
<body>

<div class="card" id="authView">
  <button class="theme-toggle" id="themeToggle">🌙</button>
  <h1 id="authTitle">Sign in</h1>
  <input type="text" id="username" placeholder="Username" autocomplete="username" style="display:none;" />
  <input type="text" id="email" placeholder="Email or phone number" autocomplete="email" />
  <input type="tel" id="phone" placeholder="Phone number (optional)" autocomplete="tel" style="display:none;" />
  <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
  <button id="authSubmit">Sign in</button>
  <div class="error" id="authError"></div>
  <div class="switch">
    <span id="switchText">No account? <a id="switchLink">Sign up</a></span>
  </div>
</div>

<div class="card" id="chatView">
  <button class="theme-toggle" id="themeToggleChat">🌙</button>
  <div class="topbar">
    <div id="whoami"></div>
    <button id="logoutBtn">Log out</button>
  </div>
  <input type="email" id="recipient" placeholder="Chat with (email)" />
  <div id="messages"></div>
  <div class="row">
    <input type="text" id="messageText" placeholder="Type a message..." />
    <button id="sendBtn">Send</button>
  </div>
  <div class="error" id="chatError"></div>
</div>

<script>
const API = "";
let token = null;
let myEmail = null;
let myUsername = null;
let isSignup = false;
let pollTimer = null;

const authView = document.getElementById("authView");
const chatView = document.getElementById("chatView");
const authTitle = document.getElementById("authTitle");
const authSubmit = document.getElementById("authSubmit");
const authError = document.getElementById("authError");
const switchText = document.getElementById("switchText");
const switchLink = document.getElementById("switchLink");

// --- Theme (dark / light) ---
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const label = theme === "light" ? "☀️ Normal Mode" : "🌙 Dark Mode";
  document.getElementById("themeToggle").textContent = label;
  document.getElementById("themeToggleChat").textContent = label;
  localStorage.setItem("secureChatTheme", theme);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
  applyTheme(current === "light" ? "dark" : "light");
}

document.getElementById("themeToggle").addEventListener("click", toggleTheme);
document.getElementById("themeToggleChat").addEventListener("click", toggleTheme);

(function initTheme() {
  const saved = localStorage.getItem("secureChatTheme");
  if (saved) {
    applyTheme(saved);
  } else {
    const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
    applyTheme(prefersLight ? "light" : "dark");
  }
})();

function toggleAuthMode() {
  isSignup = !isSignup;
  authTitle.textContent = isSignup ? "Sign up" : "Sign in";
  authSubmit.textContent = isSignup ? "Sign up" : "Sign in";
  document.getElementById("username").style.display = isSignup ? "block" : "none";
  document.getElementById("phone").style.display = isSignup ? "block" : "none";
  document.getElementById("email").placeholder = isSignup ? "Email" : "Email or phone number";
  switchText.innerHTML = isSignup
    ? 'Have an account? <a id="switchLink">Sign in</a>'
    : 'No account? <a id="switchLink">Sign up</a>';
  document.getElementById("switchLink").addEventListener("click", toggleAuthMode);
  authError.textContent = "";
}

switchLink.addEventListener("click", toggleAuthMode);

async function handleAuthSubmit() {
  const email = document.getElementById("email").value.trim();
  const username = document.getElementById("username").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;
  authError.textContent = "";

  if (!email || !password || (isSignup && !username)) {
    authError.textContent = isSignup
      ? "Please enter username, email and password."
      : "Please enter your email/phone and password.";
    return;
  }

  try {
    let res, data;
    if (isSignup) {
      res = await fetch("/api/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, username, phone: phone || null, password }),
      });
    } else {
      const form = new URLSearchParams();
      form.append("username", email); // holds email OR phone typed by the user
      form.append("password", password);
      res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: form,
      });
    }
    data = await res.json();
    if (!res.ok) {
      authError.textContent = data.detail || "Something went wrong.";
      return;
    }
    token = data.access_token;
    myEmail = data.email;
    myUsername = data.username;
    localStorage.setItem("secureChatToken", token);
    localStorage.setItem("secureChatEmail", myEmail);
    localStorage.setItem("secureChatUsername", myUsername);
    showChat();
  } catch (err) {
    authError.textContent = "Network error. Please try again.";
  }
}

authSubmit.addEventListener("click", handleAuthSubmit);
document.getElementById("password").addEventListener("keydown", (e) => {
  if (e.key === "Enter") handleAuthSubmit();
});

function showChat() {
  authView.style.display = "none";
  chatView.style.display = "block";
  document.getElementById("whoami").textContent = myUsername || myEmail;
}

document.getElementById("logoutBtn").addEventListener("click", () => {
  token = null;
  myEmail = null;
  myUsername = null;
  localStorage.removeItem("secureChatToken");
  localStorage.removeItem("secureChatEmail");
  localStorage.removeItem("secureChatUsername");
  clearInterval(pollTimer);
  chatView.style.display = "none";
  authView.style.display = "block";
});

async function loadMessages() {
  const other = document.getElementById("recipient").value.trim();
  const chatError = document.getElementById("chatError");
  if (!other) return;

  try {
    const res = await fetch(`/api/messages/${encodeURIComponent(other)}`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    const data = await res.json();
    if (!res.ok) {
      chatError.textContent = data.detail || "Could not load messages.";
      return;
    }
    chatError.textContent = "";
    const box = document.getElementById("messages");
    box.innerHTML = "";
    data.forEach((m) => {
      const div = document.createElement("div");
      div.className = "msg " + (m.sender_email === myEmail ? "mine" : "theirs");
      const time = new Date(m.created_at).toLocaleTimeString();
      div.innerHTML = `${escapeHtml(m.text)}<small>${escapeHtml(m.sender_username)} · ${time}</small>`;
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  } catch (err) {
    chatError.textContent = "Network error loading messages.";
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById("recipient").addEventListener("change", () => {
  clearInterval(pollTimer);
  loadMessages();
  pollTimer = setInterval(loadMessages, 3000);
});

document.getElementById("sendBtn").addEventListener("click", sendMessage);
document.getElementById("messageText").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});

async function sendMessage() {
  const other = document.getElementById("recipient").value.trim();
  const text = document.getElementById("messageText").value.trim();
  const chatError = document.getElementById("chatError");
  if (!other) {
    chatError.textContent = "Enter who you're chatting with first.";
    return;
  }
  if (!text) return;

  try {
    const res = await fetch("/api/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`,
      },
      body: JSON.stringify({ receiver_email: other, text }),
    });
    const data = await res.json();
    if (!res.ok) {
      chatError.textContent = data.detail || "Could not send message.";
      return;
    }
    document.getElementById("messageText").value = "";
    chatError.textContent = "";
    loadMessages();
  } catch (err) {
    chatError.textContent = "Network error sending message.";
  }
}

// Auto-login if a token is already stored
window.addEventListener("load", () => {
  const savedToken = localStorage.getItem("secureChatToken");
  const savedEmail = localStorage.getItem("secureChatEmail");
  const savedUsername = localStorage.getItem("secureChatUsername");
  if (savedToken && savedEmail) {
    token = savedToken;
    myEmail = savedEmail;
    myUsername = savedUsername;
    showChat();
  }
});
</script>
</body>
</html>
