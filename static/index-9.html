<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Secure Chat</title>
<link rel="manifest" href="/static/manifest.json" />
<meta name="theme-color" content="#000000" />
<link rel="icon" href="/icon-192.png" />
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #000000;
    --card-bg: #121212;
    --text: #f5f0e8;
    --muted-text: #a89aa0;
    --input-bg: #1a1a1a;
    --border: #2a2a2a;
    --accent: #7d2050;
    --accent-hover: #93265f;
    --accent-text: #f5f0e8;
    --accent-gradient: #7d2050;
    --bubble-theirs: #262626;
    --shadow: rgba(0,0,0,0.5);
    --seen-tick: #6fe3a4;
  }

  html[data-theme="light"] {
    --bg: #f4ead2;
    --card-bg: #fffaf0;
    --text: #241726;
    --muted-text: #8a7860;
    --input-bg: #ece0c2;
    --border: #ddcda0;
    --accent: #5c1a3d;
    --accent-hover: #4a1531;
    --accent-text: #f7ecd9;
    --accent-gradient: #5c1a3d;
    --bubble-theirs: #e6d9b8;
    --shadow: rgba(0,0,0,0.12);
    --seen-tick: #3d8b5f;
  }

  html[data-theme="gold"] {
    --bg: #16121f;
    --card-bg: #1c1729;
    --text: #f0e6ea;
    --muted-text: #9c8fa8;
    --input-bg: #221c30;
    --border: #332a44;
    --accent: #d18a77;
    --accent-hover: #b96f5e;
    --accent-text: #241a1f;
    --accent-gradient: linear-gradient(135deg, #c97b8a, #d9a86a);
    --bubble-theirs: #2a2138;
    --shadow: rgba(0,0,0,0.5);
    --seen-tick: #e0b060;
  }

  html, body {
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, color 0.2s;
    overflow: hidden;
  }
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 30px var(--shadow);
    position: relative;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 16px;
    color: var(--accent);
  }
  input, button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 15px;
  }
  input {
    background: var(--input-bg);
    color: var(--text);
  }
  button {
    background: var(--accent-gradient);
    color: var(--accent-text);
    font-weight: 600;
    border: none;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  .error { color: #f87171; font-size: 14px; margin-top: 6px; min-height: 18px; }
  .switch { text-align: center; margin-top: 10px; font-size: 14px; color: var(--muted-text); }
  .switch a { color: var(--accent); cursor: pointer; text-decoration: underline; }

  #listView, #chatView { display: none; width: 100%; max-width: 500px; }

  /* --- Fullscreen on phones: no centered card, edge-to-edge --- */
  @media (max-width: 700px) {
    body { align-items: stretch; justify-content: stretch; }
    .card {
      max-width: 100%;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border-radius: 0;
      box-shadow: none;
      margin: 0;
      padding: 16px;
      padding-top: calc(16px + env(safe-area-inset-top));
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      overflow-y: auto;
    }
    #listView, #chatView { max-width: 100%; }
  }

  /* --- Chat list screen --- */
  #listView.card { padding-bottom: 0; }

  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .list-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    margin: 0;
  }
  .list-header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .icon-btn {
    width: auto;
    margin: 0;
    padding: 8px 10px;
    font-size: 13px;
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { background: var(--bubble-theirs); }

  #convList {
    max-height: 55vh;
    overflow-y: auto;
    margin-top: 6px;
  }
  .conv-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 6px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .conv-item:hover { background: var(--input-bg); }
  .avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--accent-gradient);
    color: var(--accent-text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 17px;
    flex-shrink: 0;
  }
  .conv-info { flex: 1; min-width: 0; }
  .conv-top-row { display: flex; justify-content: space-between; align-items: baseline; }
  .conv-name { font-weight: 600; font-size: 15px; }
  .conv-time { font-size: 11px; color: var(--muted-text); flex-shrink: 0; margin-left: 6px; }
  .conv-preview {
    font-size: 13px;
    color: var(--muted-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .unread-badge {
    background: var(--accent-gradient);
    color: var(--accent-text);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    margin-left: 6px;
    flex-shrink: 0;
  }
  .empty-hint { color: var(--muted-text); font-size: 14px; text-align: center; padding: 24px 0; }

  /* --- Bottom tab bar (Chats / Calls) --- */
  .bottom-nav {
    display: flex;
    border-top: 1px solid var(--border);
    margin: 16px -24px 0;
  }
  .nav-tab {
    flex: 1;
    text-align: center;
    padding: 12px 0 14px;
    font-size: 12px;
    color: var(--muted-text);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    user-select: none;
  }
  .nav-tab .nav-icon { font-size: 20px; line-height: 1; }
  .nav-tab.active { color: var(--accent); font-weight: 600; }

  /* --- Chat conversation screen --- */
  #messages {
    background: var(--input-bg);
    border-radius: 8px;
    padding: 12px;
    height: 320px;
    overflow-y: auto;
    margin-bottom: 10px;
  }
  .msg { margin: 6px 0; padding: 8px 12px; border-radius: 8px; max-width: 75%; word-wrap: break-word; }
  .msg.mine { background: var(--accent-gradient); color: var(--accent-text); margin-left: auto; }
  .msg.theirs { background: var(--bubble-theirs); color: var(--text); }
  .msg small { display: flex; align-items: center; gap: 4px; font-size: 11px; opacity: 0.85; margin-top: 2px; }
  .ticks { font-size: 13px; letter-spacing: -2px; }
  .ticks.seen { color: var(--seen-tick); opacity: 1; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  .row button { width: auto; padding: 12px 18px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .topbar button { width: auto; background: var(--bubble-theirs); color: var(--text); padding: 8px 14px; flex-shrink: 0; }
  .back-btn {
    background: none !important;
    border: none;
    color: var(--text);
    font-size: 20px;
    padding: 4px 8px !important;
    cursor: pointer;
    width: auto !important;
  }
  .chat-title { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .theme-toggle {
    position: absolute;
    top: 16px;
    right: 16px;
    width: auto;
    margin: 0;
    padding: 6px 12px;
    font-size: 12px;
    white-space: nowrap;
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .theme-toggle:hover { background: var(--bubble-theirs); }
  #listView .theme-toggle, #chatView .theme-toggle { position: static; }

  /* --- Call buttons in chat topbar --- */
  .call-btn {
    width: auto !important;
    background: var(--bubble-theirs) !important;
    color: var(--text) !important;
    padding: 8px 10px !important;
    font-size: 16px !important;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* --- Call overlay (ringing / in-call) --- */
  #callOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,10,12,0.92);
    z-index: 1000;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
    padding: 24px;
  }
  #callAvatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: var(--accent-gradient);
    color: var(--accent-text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 34px;
    margin-bottom: 18px;
  }
  #callPeerName { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  #callStatus { font-size: 14px; color: #bbb; margin-bottom: 6px; }
  #callTimer { font-size: 15px; color: #eee; letter-spacing: 1px; margin-bottom: 24px; min-height: 18px; display: none; }

  /* --- Call history list (Calls tab) --- */
  .call-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 6px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .call-item:hover { background: var(--input-bg); }
  .call-info { flex: 1; min-width: 0; }
  .call-top-row { display: flex; justify-content: space-between; align-items: baseline; }
  .call-name { font-weight: 600; font-size: 15px; }
  .call-time { font-size: 11px; color: var(--muted-text); flex-shrink: 0; margin-left: 6px; }
  .call-meta { font-size: 13px; color: var(--muted-text); display: flex; align-items: center; gap: 5px; }
  .call-meta.missed { color: #f87171; }
  .call-type-btn { width: auto; margin: 0; padding: 8px 10px; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); flex-shrink: 0; }
  .call-videos {
    position: relative;
    width: 100%;
    max-width: 480px;
    display: none;
  }
  #remoteVideo {
    width: 100%;
    border-radius: 12px;
    background: #000;
    max-height: 55vh;
  }
  #localVideo {
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 100px;
    border-radius: 8px;
    border: 2px solid #fff;
    background: #000;
  }
  .call-controls { display: flex; gap: 20px; margin-top: 26px; }
  .call-controls button {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    font-size: 22px;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .call-btn-accept { background: #22c55e !important; color: #fff !important; }
  .call-btn-reject, .call-btn-end { background: #ef4444 !important; color: #fff !important; }
  .call-btn-mute, .call-btn-cam, .call-btn-speaker, .call-btn-flip { background: #3a3b3e !important; color: #fff !important; }
  .call-btn-mute.off, .call-btn-cam.off, .call-btn-speaker.off { background: var(--accent-gradient) !important; }
  #incomingCallActions, #outgoingCallActions, #activeCallActions { display: none; }
  #callOverlay { }
  .otp-view { display: none; }

  /* --- Avatars with images --- */
  .avatar { overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .avatar.clickable { cursor: pointer; }
  #myAvatarWrap { position: relative; width: 34px; height: 34px; flex-shrink: 0; }
  #myAvatarWrap .avatar { width: 34px; height: 34px; font-size: 14px; }

  /* --- New group button --- */
  .list-actions-row { display: flex; gap: 8px; margin: 6px 0; }
  .list-actions-row button { width: auto; flex: 1; font-size: 13px; padding: 9px; }

  /* --- Attach button + file message --- */
  .attach-btn {
    width: auto !important;
    background: var(--bubble-theirs) !important;
    color: var(--text) !important;
    padding: 10px 12px !important;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .msg-img { max-width: 100%; border-radius: 8px; display: block; margin-top: 4px; cursor: pointer; }
  .msg-file-link {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    padding: 8px 10px;
    background: rgba(0,0,0,0.15);
    border-radius: 6px;
    text-decoration: none;
    color: inherit;
    font-size: 13px;
  }
  .msg-deleted { font-style: italic; opacity: 0.6; }
  .msg-edited-tag { font-size: 10px; opacity: 0.7; margin-left: 4px; }
  .msg-sender-name { font-size: 11px; font-weight: 600; opacity: 0.8; margin-bottom: 2px; }
  .msg-actions {
    display: none;
    gap: 10px;
    margin-top: 4px;
    font-size: 12px;
  }
  .msg-actions a { color: inherit; opacity: 0.8; cursor: pointer; text-decoration: underline; }
  .msg.mine { cursor: pointer; }
  .msg.mine.actions-open .msg-actions { display: flex; }

  /* --- New group creation view --- */
  #groupUserResults { max-height: 30vh; overflow-y: auto; margin: 6px 0; }
  .group-user-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 4px;
    cursor: pointer;
  }
  .group-user-row.selected { background: var(--input-bg); border-radius: 6px; }
  .selected-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--accent-gradient);
    color: var(--accent-text);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px;
    margin: 3px 4px 3px 0;
  }
  .selected-chip span.remove { cursor: pointer; font-weight: 700; }
</style>
</head>
<body>

<div class="card" id="authView">
  <button class="theme-toggle" id="themeToggle">🌙</button>
  <h1 id="authTitle">Sign in</h1>
  <input type="text" id="username" placeholder="Username" autocomplete="username" style="display:none;" />
  <input type="text" id="email" placeholder="Email or phone number" autocomplete="email" />
  <input type="tel" id="phone" placeholder="Phone number (optional)" autocomplete="tel" style="display:none;" />
  <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
  <button id="authSubmit">Sign in</button>
  <div class="error" id="authError"></div>
  <div class="switch">
    <span id="switchText">No account? <a id="switchLink">Sign up</a></span>
  </div>
  <div class="switch" id="forgotWrap">
    <a id="forgotLink">Forgot password?</a>
  </div>
</div>

<div class="card" id="forgotView" style="display:none;">
  <h1>Reset password</h1>

  <div id="forgotStep1">
    <input type="text" id="forgotEmail" placeholder="Your email" autocomplete="email" />
    <button id="sendCodeBtn">Send verification code</button>
  </div>

  <div id="forgotStep2" style="display:none;">
    <input type="text" id="otpCode" placeholder="6-digit code from your email" autocomplete="off" />
    <input type="password" id="newPassword" placeholder="New password" autocomplete="new-password" />
    <button id="resetPasswordBtn">Reset password</button>
  </div>

  <div class="error" id="forgotError"></div>
  <div class="switch"><a id="backToSignIn">Back to sign in</a></div>
</div>

<div class="card" id="listView">
  <div class="list-header">
    <h1 class="list-title">Smart Chat</h1>
    <div class="list-header-right">
      <div id="myAvatarWrap">
        <div class="avatar clickable" id="myAvatar">?</div>
        <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" />
      </div>
      <button class="icon-btn" id="themeToggleList">🌙</button>
      <button class="icon-btn" id="logoutBtnList">Log out</button>
    </div>
  </div>
  <input type="text" id="convSearch" placeholder="Search chats or find someone..." autocomplete="off" />
  <div class="list-actions-row">
    <button id="newGroupBtn"><span id="newGroupIcon"></span> New group</button>
  </div>
  <div id="convList"></div>
  <div id="callsPane" style="display:none;"></div>

  <div class="bottom-nav">
    <div class="nav-tab active" id="tabChats">
      <span class="nav-icon" id="tabChatsIcon"></span>
      <span>Chats</span>
    </div>
    <div class="nav-tab" id="tabCalls">
      <span class="nav-icon" id="tabCallsIcon"></span>
      <span>Calls</span>
    </div>
  </div>
</div>

<div class="card" id="newGroupView" style="display:none;">
  <h1>New group</h1>
  <input type="text" id="groupNameInput" placeholder="Group name" autocomplete="off" />
  <input type="text" id="groupUserSearch" placeholder="Search people to add..." autocomplete="off" />
  <div id="selectedMembers"></div>
  <div id="groupUserResults"></div>
  <button id="createGroupBtn">Create group</button>
  <div class="error" id="groupError"></div>
  <div class="switch"><a id="cancelNewGroup">Cancel</a></div>
</div>

<div class="card" id="chatView">
  <button class="theme-toggle" id="themeToggleChat">🌙</button>
  <div class="topbar">
    <div class="topbar-left">
      <button class="back-btn" id="backBtn">←</button>
      <div class="chat-title" id="chatTitle"></div>
    </div>
    <div style="display:flex; gap:6px;" id="dmCallButtons">
      <button class="call-btn" id="voiceCallBtn" title="Voice call"></button>
      <button class="call-btn" id="videoCallBtn" title="Video call"></button>
      <button id="logoutBtn">Log out</button>
    </div>
  </div>
  <div id="messages"></div>
  <div class="row">
    <button class="attach-btn" id="attachBtn" title="Attach file"></button>
    <input type="file" id="chatFileInput" style="display:none;" />
    <input type="text" id="messageText" placeholder="Type a message..." />
    <button id="sendBtn">Send</button>
  </div>
  <div class="error" id="chatError"></div>
</div>

<div id="callOverlay">
  <div id="callAvatar">?</div>
  <div id="callPeerName"></div>
  <div id="callStatus">Calling...</div>
  <div id="callTimer"></div>

  <div class="call-videos" id="callVideos">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

  <div class="call-controls" id="incomingCallActions">
    <button class="call-btn-reject" id="rejectCallBtn"></button>
    <button class="call-btn-accept" id="acceptCallBtn"></button>
  </div>

  <div class="call-controls" id="outgoingCallActions">
    <button class="call-btn-end" id="cancelCallBtn"></button>
  </div>

  <div class="call-controls" id="activeCallActions">
    <button class="call-btn-mute" id="muteBtn"></button>
    <button class="call-btn-speaker" id="speakerBtn"></button>
    <button class="call-btn-cam" id="camBtn"></button>
    <button class="call-btn-flip" id="flipCamBtn" style="display:none;"></button>
    <button class="call-btn-end" id="endCallBtn"></button>
  </div>
</div>

<script>
const ICON = {
  moon: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  sun: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>',

// --- Theme (light / dark / gold) ---
const THEME_META = {
  light: { icon: ICON.sun, label: "Normal Mode", color: "#f4ead2" },
  dark: { icon: ICON.moon, label: "Dark Mode", color: "#000000" },
  gold: { icon: ICON.star, label: "Gold Mode", color: "#16121f" },
};

function applyTheme(theme) {
  if (!THEME_META[theme]) theme = "dark";
  document.documentElement.setAttribute("data-theme", theme);
  const meta = THEME_META[theme];
  document.getElementById("themeToggle").innerHTML = `${meta.icon} ${meta.label}`;
  document.getElementById("themeToggleList").innerHTML = meta.icon;
  document.getElementById("themeToggleChat").innerHTML = `${meta.icon} ${meta.label}`;
  const metaTag = document.querySelector('meta[name="theme-color"]');
  if (metaTag) metaTag.setAttribute("content", meta.color);
  localStorage.setItem("secureChatTheme", theme);
}

function toggleTheme() {
  const order = ["light", "dark", "gold"];
  const current = document.documentElement.getAttribute("data-theme") || "dark";
  const next = order[(order.indexOf(current) + 1) % order.length];
  applyTheme(next);
}

document.getElementById("themeToggle").addEventListener("click", toggleTheme);
document.getElementById("themeToggleList").addEventListener("click", toggleTheme);
document.getElementById("themeToggleChat").addEventListener("click", toggleTheme);

(function initTheme() {
  const saved = localStorage.getItem("secureChatTheme");
  if (saved && THEME_META[saved]) {
    applyTheme(saved);
  } else {
    const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
    applyTheme(prefersLight ? "light" : "dark");
  }
})();

async function handleAuthSubmit() {
  const email = document.getElementById("email").value.trim();
  const username = document.getElementById("username").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;
  authError.textContent = "";

  if (!email || !password || (isSignup && !username)) {
    authError.textContent = isSignup
      ? "Please enter username, email and password."
      : "Please enter your email/phone and password.";
    return;
  }

  try {
    let res, data;
    if (isSignup) {
      res = await fetch("/api/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, username, phone: phone || null, password }),
      });
    } else {
      const form = new URLSearchParams();
      form.append("username", email); // holds email OR phone typed by the user
      form.append("password", password);
      res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: form,
      });
    }
    data = await res.json();
    if (!res.ok) {
      authError.textContent = data.detail || "Something went wrong.";
      return;
    }
    token = data.access_token;
    myEmail = data.email;
    myUsername = data.username;
    localStorage.setItem("secureChatToken", token);
    localStorage.setItem("secureChatEmail", myEmail);
    localStorage.setItem("secureChatUsername", myUsername);
    showList();
    connectSignaling();
    fetchMyProfile();
  } catch (err) {
    authError.textContent = "Network error. Please try again.";
  }
}

async function fetchMyProfile() {
  try {
    const res = await fetch("/api/me", { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) return;
    const data = await res.json();
    myAvatarUrl = data.avatar_url || null;
    const myAvatarEl = document.getElementById("myAvatar");
    if (myAvatarEl) myAvatarEl.innerHTML = avatarHtml(myUsername, myAvatarUrl);
  } catch (err) {
    // ignore
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function initials(name) {
  return (name || "?").trim().charAt(0).toUpperCase();
}

function formatTime(iso) {
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString([], { month: "short", day: "numeric" });
}

function avatarHtml(name, avatarUrl) {
  if (avatarUrl) {
    return `<img src="${escapeHtml(avatarUrl)}" alt="" />`;
  }
  return initials(name);
}

function formatCallDuration(secs) {
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return m > 0 ? `${m}m ${s}s` : `${s}s`;
}

async function loadCallHistory() {
  callsPane.innerHTML = '<div class="empty-hint">Loading...</div>';
  try {
    const res = await fetch("/api/calls", { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) throw new Error("Failed to load calls");
    const calls = await res.json();
    renderCallHistory(calls);
  } catch (e) {
    callsPane.innerHTML = '<div class="empty-hint">Could not load call history.</div>';
  }
}

function renderCallHistory(calls) {
  callsPane.innerHTML = "";
  if (calls.length === 0) {
    callsPane.innerHTML = `<div class="empty-hint">${ICON.phone} No calls yet.</div>`;
    return;
  }
  calls.forEach((c) => {
    const isMissed = c.status === "missed" || c.status === "canceled";
    const arrow = c.direction === "outgoing" ? ICON.arrowOut : ICON.arrowIn;
    let label;
    if (c.status === "completed") {
      label = formatCallDuration(c.duration_seconds);
    } else if (c.status === "busy") {
      label = "Busy";
    } else if (c.status === "canceled") {
      label = c.direction === "outgoing" ? "Canceled" : "Missed call";
    } else {
      label = c.direction === "outgoing" ? "No answer" : "Missed call";
    }
    const typeIcon = c.is_video ? ICON.video : ICON.phone;

    const item = document.createElement("div");
    item.className = "call-item";
    item.innerHTML = `
      <div class="avatar">${avatarHtml(c.peer_username, c.peer_avatar_url)}</div>
      <div class="call-info">
        <div class="call-top-row">
          <div class="call-name">${escapeHtml(c.peer_username)}</div>
          <div class="call-time">${formatTime(c.created_at)}</div>
        </div>
        <div class="call-meta ${isMissed ? "missed" : ""}">
          <span>${arrow}</span><span>${label}</span>
        </div>
      </div>
      <button class="call-type-btn" title="${c.is_video ? "Video call" : "Voice call"}">${typeIcon}</button>
    `;
    item.addEventListener("click", () => openChat(c.peer_email, c.peer_username, c.peer_avatar_url));
    item.querySelector(".call-type-btn").addEventListener("click", (ev) => {
      ev.stopPropagation();
      openChat(c.peer_email, c.peer_username, c.peer_avatar_url);
      setTimeout(() => startCall(c.is_video), 200);
    });
    callsPane.appendChild(item);
  });
}

async function loadConversations() {
  try {
    const [dmRes, groupRes] = await Promise.all([
      fetch("/api/conversations", { headers: { Authorization: `Bearer ${token}` } }),
      fetch("/api/groups", { headers: { Authorization: `Bearer ${token}` } }),
    ]);
    const dms = dmRes.ok ? await dmRes.json() : [];
    const groups = groupRes.ok ? await groupRes.json() : [];
    const merged = [
      ...dms.map((c) => ({ kind: "dm", ...c, sortTime: c.last_time })),
      ...groups.map((g) => ({ kind: "group", ...g, sortTime: g.last_time || "1970-01-01" })),
    ];
    merged.sort((a, b) => new Date(b.sortTime) - new Date(a.sortTime));
    renderConvList(merged);
  } catch (err) {
    // silent fail on background poll
  }
}

function renderConvList(items) {
  const box = document.getElementById("convList");
  box.innerHTML = "";
  if (items.length === 0) {
    box.innerHTML = '<div class="empty-hint">No chats yet. Search a username or email above to start one.</div>';
    return;
  }
  items.forEach((c) => {
    const item = document.createElement("div");
    item.className = "conv-item";
    if (c.kind === "group") {
      item.innerHTML = `
        <div class="avatar">${avatarHtml(c.name, c.avatar_url) || ICON.users}</div>
        <div class="conv-info">
          <div class="conv-top-row">
            <div class="conv-name">${escapeHtml(c.name)}</div>
            <div class="conv-time">${c.last_time ? formatTime(c.last_time) : ""}</div>
          </div>
          <div class="conv-preview"><span>${escapeHtml(c.last_message || "No messages yet")}</span></div>
        </div>
      `;
      item.addEventListener("click", () => openGroupChat(c.id, c.name, c.avatar_url));
    } else {
      const isMine = c.last_sender_email === myEmail;
      const tickHtml = isMine
        ? `<span class="ticks ${c.last_message_read ? 'seen' : ''}">${c.last_message_read ? '✓✓' : '✓'}</span>`
        : "";
      item.innerHTML = `
        <div class="avatar">${avatarHtml(c.username, c.avatar_url)}</div>
        <div class="conv-info">
          <div class="conv-top-row">
            <div class="conv-name">${escapeHtml(c.username)}</div>
            <div class="conv-time">${formatTime(c.last_time)}</div>
          </div>
          <div class="conv-preview">${tickHtml}<span>${escapeHtml(c.last_message)}</span>
            ${c.unread_count > 0 ? `<span class="unread-badge">${c.unread_count}</span>` : ""}
          </div>
        </div>
      `;
      item.addEventListener("click", () => openChat(c.email, c.username, c.avatar_url));
    }
    box.appendChild(item);
  });
}

let searchDebounce = null;
document.getElementById("convSearch").addEventListener("input", (e) => {
  const q = e.target.value.trim();
  clearTimeout(searchDebounce);
  if (!q) {
    loadConversations();
    return;
  }
  searchDebounce = setTimeout(() => runSearch(q), 300);
});

async function runSearch(q) {
  try {
    const res = await fetch(`/api/users/search?q=${encodeURIComponent(q)}`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    const data = await res.json();
    const box = document.getElementById("convList");
    box.innerHTML = "";
    if (!res.ok || data.length === 0) {
      box.innerHTML = '<div class="empty-hint">No matching users found.</div>';
      return;
    }
    data.forEach((u) => {
      const item = document.createElement("div");
      item.className = "conv-item";
      item.innerHTML = `
        <div class="avatar">${avatarHtml(u.username, u.avatar_url)}</div>
        <div class="conv-info">
          <div class="conv-top-row"><div class="conv-name">${escapeHtml(u.username)}</div></div>
          <div class="conv-preview">${escapeHtml(u.email)}</div>
        </div>
      `;
      item.addEventListener("click", () => openChat(u.email, u.username, u.avatar_url));
      box.appendChild(item);
    });
  } catch (err) {
    // ignore
  }
}

    if (res.ok) {
      myAvatarUrl = data.avatar_url;
      document.getElementById("myAvatar").innerHTML = avatarHtml(myUsername, myAvatarUrl);
    }
  } catch (err) {
    // ignore
  }
  e.target.value = "";
});

// New group creation
// ---------------------------------------------------------------------
const newGroupView = document.getElementById("newGroupView");

document.getElementById("newGroupBtn").addEventListener("click", () => {
  selectedGroupMembers = {};
  document.getElementById("groupNameInput").value = "";
  document.getElementById("groupUserSearch").value = "";
  document.getElementById("groupUserResults").innerHTML = "";
  document.getElementById("groupError").textContent = "";
  renderSelectedMembers();
  listView.style.display = "none";
  newGroupView.style.display = "block";
});

document.getElementById("cancelNewGroup").addEventListener("click", () => {
  newGroupView.style.display = "none";
  listView.style.display = "block";
});

function renderSelectedMembers() {
  const box = document.getElementById("selectedMembers");
  const emails = Object.keys(selectedGroupMembers);
  box.innerHTML = emails
    .map(
      (email) =>
        `<span class="selected-chip">${escapeHtml(selectedGroupMembers[email].username)}<span class="remove" data-email="${escapeHtml(email)}">${ICON.close}</span></span>`
    )
    .join("");
  box.querySelectorAll(".remove").forEach((el) => {
    el.addEventListener("click", () => {
      delete selectedGroupMembers[el.dataset.email];
      renderSelectedMembers();
    });
  });
}

let groupSearchDebounce = null;
document.getElementById("groupUserSearch").addEventListener("input", (e) => {
  const q = e.target.value.trim();
  clearTimeout(groupSearchDebounce);
  if (!q) {
    document.getElementById("groupUserResults").innerHTML = "";
    return;
  }
  groupSearchDebounce = setTimeout(async () => {
    try {
      const res = await fetch(`/api/users/search?q=${encodeURIComponent(q)}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      const box = document.getElementById("groupUserResults");
      box.innerHTML = "";
      if (!res.ok) return;
      data.forEach((u) => {
        const row = document.createElement("div");
        row.className = "group-user-row" + (selectedGroupMembers[u.email] ? " selected" : "");
        row.innerHTML = `<div class="avatar">${avatarHtml(u.username, u.avatar_url)}</div><div>${escapeHtml(u.username)}</div>`;
        row.addEventListener("click", () => {
          if (selectedGroupMembers[u.email]) {
            delete selectedGroupMembers[u.email];
          } else {
            selectedGroupMembers[u.email] = { email: u.email, username: u.username };
          }
          renderSelectedMembers();
          row.classList.toggle("selected");
        });
        box.appendChild(row);
      });
    } catch (err) {
      // ignore
    }
  }, 300);
});

document.getElementById("createGroupBtn").addEventListener("click", async () => {
  const name = document.getElementById("groupNameInput").value.trim();
  const groupError = document.getElementById("groupError");
  groupError.textContent = "";
  if (!name) {
    groupError.textContent = "Please enter a group name.";
    return;
  }
  const memberEmails = Object.keys(selectedGroupMembers);
  if (memberEmails.length === 0) {
    groupError.textContent = "Add at least one person to the group.";
    return;
  }
  try {
    const res = await fetch("/api/groups", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ name, member_emails: memberEmails }),
    });
    const data = await res.json();
    if (!res.ok) {
      groupError.textContent = data.detail || "Could not create group.";
      return;
    }
    newGroupView.style.display = "none";
    openGroupChat(data.id, data.name, data.avatar_url);
  } catch (err) {
    groupError.textContent = "Network error. Please try again.";
  }
});

// ---------------------------------------------------------------------
// Chat CONVERSATION screen (DM)
// ---------------------------------------------------------------------

function openChat(email, username, avatarUrl) {
  currentChatType = "dm";
  currentRecipient = email;
  currentGroupId = null;
  document.getElementById("chatTitle").textContent = username || email;
  document.getElementById("dmCallButtons").style.display = "flex";
  document.getElementById("convSearch").value = "";
  listView.style.display = "none";
  chatView.style.display = "block";
  clearInterval(listPollTimer);
  loadMessages();
  clearInterval(pollTimer);
  pollTimer = setInterval(loadMessages, 3000);
}

function openGroupChat(groupId, name, avatarUrl) {
  currentChatType = "group";
  currentGroupId = groupId;
  currentRecipient = null;
  document.getElementById("chatTitle").textContent = name;
  document.getElementById("dmCallButtons").style.display = "none";
  document.getElementById("convSearch").value = "";
  listView.style.display = "none";
  chatView.style.display = "block";
  clearInterval(listPollTimer);
  loadMessages();
  clearInterval(pollTimer);
  pollTimer = setInterval(loadMessages, 3000);
}

document.getElementById("backBtn").addEventListener("click", () => {
  clearInterval(pollTimer);
  currentRecipient = null;
  currentGroupId = null;
  showList();
});

function renderFileContent(m) {
  if (!m.file_url) return "";
  if ((m.file_type || "").startsWith("image/")) {
    return `<img class="msg-img" src="${escapeHtml(m.file_url)}" alt="${escapeHtml(m.file_name || 'image')}" onclick="window.open('${escapeHtml(m.file_url)}','_blank')" />`;
  }
  return `<a class="msg-file-link" href="${escapeHtml(m.file_url)}" target="_blank">${ICON.paperclip} ${escapeHtml(m.file_name || 'File')}</a>`;
}

async function loadMessages() {
  const chatError = document.getElementById("chatError");
  if (currentChatType === "dm" && !currentRecipient) return;
  if (currentChatType === "group" && !currentGroupId) return;

  try {
    const url =
      currentChatType === "group"
        ? `/api/groups/${currentGroupId}/messages`
        : `/api/messages/${encodeURIComponent(currentRecipient)}`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    const data = await res.json();
    if (!res.ok) {
      chatError.textContent = data.detail || "Could not load messages.";
      return;
    }
    chatError.textContent = "";
    const box = document.getElementById("messages");
    box.innerHTML = "";
    data.forEach((m) => {
      const div = document.createElement("div");
      const mine = m.sender_email === myEmail;
      div.className = "msg " + (mine ? "mine" : "theirs");
      const time = new Date(m.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      let bodyHtml;
      if (m.is_deleted) {
        bodyHtml = `<span class="msg-deleted">This message was deleted</span>`;
      } else {
        bodyHtml = (m.text ? escapeHtml(m.text) : "") + renderFileContent(m);
      }

      const senderNameHtml =
        currentChatType === "group" && !mine
          ? `<div class="msg-sender-name">${escapeHtml(m.sender_username)}</div>`
          : "";

      const tickHtml =
        mine && currentChatType === "dm"
          ? `<span class="ticks ${m.is_read ? 'seen' : ''}">${m.is_read ? '✓✓' : '✓'}</span>`
          : "";
      const editedTag = m.is_edited && !m.is_deleted ? `<span class="msg-edited-tag">(edited)</span>` : "";

      const actionsHtml =
        mine && !m.is_deleted
          ? `<div class="msg-actions">${m.text ? `<a class="edit-msg" data-id="${m.id}">Edit</a>` : ""}<a class="delete-msg" data-id="${m.id}">Delete</a></div>`
          : "";

      div.innerHTML = `${senderNameHtml}${bodyHtml}<small>${editedTag}${tickHtml}<span>${time}</span></small>${actionsHtml}`;

      if (mine && !m.is_deleted) {
        div.addEventListener("click", (ev) => {
          if (ev.target.closest("a") || ev.target.closest("img")) return;
          div.classList.toggle("actions-open");
        });
      }
      box.appendChild(div);
    });

    box.querySelectorAll(".delete-msg").forEach((el) => {
      el.addEventListener("click", async (ev) => {
        ev.stopPropagation();
        if (!confirm("Delete this message?")) return;
        await deleteMessage(el.dataset.id);
      });
    });
    box.querySelectorAll(".edit-msg").forEach((el) => {
      el.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const currentText = el.closest(".msg").querySelector('small')?.previousSibling?.textContent || "";
        const newText = prompt("Edit message:", currentText);
        if (newText !== null && newText.trim()) editMessage(el.dataset.id, newText.trim());
      });
    });

    box.scrollTop = box.scrollHeight;
  } catch (err) {
    chatError.textContent = "Network error loading messages.";
  }
}

async function editMessage(id, text) {
  try {
    const url = currentChatType === "group" ? `/api/groups/${currentGroupId}/messages/${id}` : `/api/messages/${id}`;
    await fetch(url, {
      method: "PATCH",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ text }),
    });
    loadMessages();
  } catch (err) {
    // ignore
  }
}

async function deleteMessage(id) {
  try {
    const url = currentChatType === "group" ? `/api/groups/${currentGroupId}/messages/${id}` : `/api/messages/${id}`;
    await fetch(url, {
      method: "DELETE",
      headers: { Authorization: `Bearer ${token}` },
    });
    loadMessages();
  } catch (err) {
    // ignore
  }
}

document.getElementById("sendBtn").addEventListener("click", () => sendMessage());
document.getElementById("messageText").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});

document.getElementById("attachBtn").addEventListener("click", () => {
  document.getElementById("chatFileInput").click();
});

document.getElementById("chatFileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const chatError = document.getElementById("chatError");
  const formData = new FormData();
  formData.append("file", file);
  try {
    const upRes = await fetch("/api/upload", {
      method: "POST",
      headers: { Authorization: `Bearer ${token}` },
      body: formData,
    });
    const upData = await upRes.json();
    if (!upRes.ok) {
      chatError.textContent = upData.detail || "Could not upload file.";
      return;
    }
    await sendMessage({ file_url: upData.url, file_name: upData.file_name, file_type: upData.file_type });
  } catch (err) {
    chatError.textContent = "Network error uploading file.";
  }
});

async function sendMessage(fileInfo) {
  const textInput = document.getElementById("messageText");
  const text = textInput.value.trim();
  const chatError = document.getElementById("chatError");
  if (currentChatType === "dm" && !currentRecipient) {
    chatError.textContent = "Open a chat first.";
    return;
  }
  if (currentChatType === "group" && !currentGroupId) {
    chatError.textContent = "Open a group first.";
    return;
  }
  if (!text && !fileInfo) return;

  const body = fileInfo
    ? { text: text || null, file_url: fileInfo.file_url, file_name: fileInfo.file_name, file_type: fileInfo.file_type }
    : { text };

  try {
    const url = currentChatType === "group" ? `/api/groups/${currentGroupId}/messages` : "/api/messages";
    const payload = currentChatType === "group" ? body : { receiver_email: currentRecipient, ...body };
    const res = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`,
      },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) {
      chatError.textContent = data.detail || "Could not send message.";
      return;
    }
    textInput.value = "";
    chatError.textContent = "";
    loadMessages();
  } catch (err) {
    chatError.textContent = "Network error sending message.";
  }
}

// ---------------------------------------------------------------------
// Calling (WebRTC + WebSocket signaling)
// ---------------------------------------------------------------------
let ws = null;
let pc = null;
let localStream = null;
let callPeerEmail = null;
let callPeerName = null;
let callIsVideo = false;
let callState = "idle"; // idle | outgoing | incoming | active
let micOn = true;
let speakerOn = true;
let camOn = true;
let currentFacingMode = "user"; // "user" = front camera, "environment" = back camera
let amICaller = false;
let callLogPeerEmail = null;
let callStartActiveTime = null;
let callTimerInterval = null;

function startCallTimer() {
  callStartActiveTime = Date.now();
  const el = document.getElementById("callTimer");
  el.style.display = "block";
  el.textContent = "00:00";
  callTimerInterval = setInterval(() => {
    const secs = Math.floor((Date.now() - callStartActiveTime) / 1000);
    const m = Math.floor(secs / 60).toString().padStart(2, "0");
    const s = (secs % 60).toString().padStart(2, "0");
    el.textContent = `${m}:${s}`;
  }, 1000);
}

function stopCallTimer() {
  if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
  const el = document.getElementById("callTimer");
  el.style.display = "none";
  el.textContent = "";
}

async function logCallIfCaller(callStatus) {
  if (!amICaller || !callLogPeerEmail) return;
  const duration = callStartActiveTime ? Math.floor((Date.now() - callStartActiveTime) / 1000) : 0;
  try {
    await fetch("/api/calls", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({
        callee_email: callLogPeerEmail,
        is_video: callIsVideo,
        status: callStatus,
        duration_seconds: duration,
      }),
    });
  } catch (e) {
    // Call log is best-effort; don't block hangup on a failed request.
  }
}

const ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" },
];

function connectSignaling() {
  if (!token) return;
  const proto = window.location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${window.location.host}/ws?token=${encodeURIComponent(token)}`);
  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch (e) { return; }
    handleSignal(msg);
  };
  ws.onclose = () => {
    ws = null;
    // try to reconnect if user is still logged in
    if (token) setTimeout(connectSignaling, 3000);
  };
}

function disconnectSignaling() {
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
}

function sendSignal(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}

function handleSignal(msg) {
  switch (msg.type) {
    case "call-offer":
      if (callState !== "idle") {
        sendSignal({ type: "call-busy", to: msg.from });
        return;
      }
      callPeerEmail = msg.from;
      callPeerName = msg.from_username || msg.from;
      callIsVideo = !!msg.video;
      callState = "incoming";
      pendingOffer = msg.sdp;
      showCallOverlay("incoming");
      break;
    case "call-answer":
      if (pc && callPeerEmail === msg.from) {
        pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
        callState = "active";
        showCallOverlay("active");
        startCallTimer();
      }
      break;
    case "ice-candidate":
      if (pc && callPeerEmail === msg.from && msg.candidate) {
        pc.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(() => {});
      }
      break;
    case "call-reject":
      if (callPeerEmail === msg.from) {
        document.getElementById("callStatus").textContent = "Call declined";
        logCallIfCaller("missed");
        setTimeout(endCall, 1200);
      }
      break;
    case "call-busy":
      if (callPeerEmail === msg.from) {
        document.getElementById("callStatus").textContent = "User is busy";
        logCallIfCaller("busy");
        setTimeout(endCall, 1200);
      }
      break;
    case "call-end":
      if (callPeerEmail === msg.from) {
        document.getElementById("callStatus").textContent = "Call ended";
        logCallIfCaller(callStartActiveTime ? "completed" : "canceled");
        setTimeout(endCall, 800);
      }
      break;
  }
}

let pendingOffer = null;

function showCallOverlay(state) {
  const overlay = document.getElementById("callOverlay");
  overlay.style.display = "flex";
  document.getElementById("callPeerName").textContent = callPeerName || callPeerEmail || "";
  document.getElementById("callAvatar").textContent = initials(callPeerName || callPeerEmail);
  document.getElementById("incomingCallActions").style.display = "none";
  document.getElementById("outgoingCallActions").style.display = "none";
  document.getElementById("activeCallActions").style.display = "none";
  document.getElementById("callVideos").style.display = "none";
  document.getElementById("callAvatar").style.display = "flex";

  if (state === "incoming") {
    document.getElementById("callStatus").textContent = callIsVideo ? "Incoming video call..." : "Incoming voice call...";
    document.getElementById("incomingCallActions").style.display = "flex";
  } else if (state === "outgoing") {
    document.getElementById("callStatus").textContent = "Calling...";
    document.getElementById("outgoingCallActions").style.display = "flex";
  } else if (state === "active") {
    document.getElementById("callStatus").textContent = callIsVideo ? "Video call" : "Voice call";
    document.getElementById("activeCallActions").style.display = "flex";
    if (callIsVideo) {
      document.getElementById("callVideos").style.display = "block";
      document.getElementById("callAvatar").style.display = "none";
      document.getElementById("flipCamBtn").style.display = "flex";
    } else {
      document.getElementById("flipCamBtn").style.display = "none";
    }
  }
}

function hideCallOverlay() {
  document.getElementById("callOverlay").style.display = "none";
}

async function startCall(video) {
  if (!currentRecipient) return;
  if (callState !== "idle") return;
  callPeerEmail = currentRecipient;
  callPeerName = document.getElementById("chatTitle").textContent;
  callIsVideo = video;
  callState = "outgoing";
  amICaller = true;
  callLogPeerEmail = currentRecipient;
  showCallOverlay("outgoing");

  currentFacingMode = "user";
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: video ? { facingMode: "user" } : false,
    });
  } catch (err) {
    document.getElementById("callStatus").textContent = "Could not access mic/camera";
    setTimeout(endCall, 1500);
    return;
  }

  setupPeerConnection();
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
  if (video) document.getElementById("localVideo").srcObject = localStream;

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  sendSignal({
    type: "call-offer",
    to: callPeerEmail,
    video: callIsVideo,
    sdp: offer,
  });
}

async function acceptCall() {
  callState = "active";
  amICaller = false;
  callLogPeerEmail = callPeerEmail;
  currentFacingMode = "user";
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: callIsVideo ? { facingMode: "user" } : false,
    });
  } catch (err) {
    sendSignal({ type: "call-reject", to: callPeerEmail });
    endCall();
    return;
  }
  setupPeerConnection();
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
  if (callIsVideo) document.getElementById("localVideo").srcObject = localStream;

  await pc.setRemoteDescription(new RTCSessionDescription(pendingOffer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  sendSignal({ type: "call-answer", to: callPeerEmail, sdp: answer });
  showCallOverlay("active");
  startCallTimer();
}

function rejectCall() {
  sendSignal({ type: "call-reject", to: callPeerEmail });
  endCall();
}

function cancelOutgoingCall() {
  sendSignal({ type: "call-end", to: callPeerEmail });
  logCallIfCaller("canceled");
  endCall();
}

function setupPeerConnection() {
  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  pc.onicecandidate = (event) => {
    if (event.candidate && callPeerEmail) {
      sendSignal({ type: "ice-candidate", to: callPeerEmail, candidate: event.candidate });
    }
  };
  pc.ontrack = (event) => {
    document.getElementById("remoteVideo").srcObject = event.streams[0];
  };
}

function endCall() {
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  document.getElementById("localVideo").srcObject = null;
  document.getElementById("remoteVideo").srcObject = null;
  stopCallTimer();
  callState = "idle";
  callPeerEmail = null;
  callPeerName = null;
  pendingOffer = null;
  amICaller = false;
  callLogPeerEmail = null;
  callStartActiveTime = null;
  micOn = true;
  camOn = true;
  speakerOn = true;
  currentFacingMode = "user";
  document.getElementById("speakerBtn").classList.remove("off");
  document.getElementById("speakerBtn").innerHTML = ICON.volume;
  document.getElementById("flipCamBtn").style.display = "none";
  hideCallOverlay();
}

document.getElementById("voiceCallBtn").addEventListener("click", () => startCall(false));
document.getElementById("videoCallBtn").addEventListener("click", () => startCall(true));
document.getElementById("acceptCallBtn").addEventListener("click", acceptCall);
document.getElementById("rejectCallBtn").addEventListener("click", rejectCall);
document.getElementById("cancelCallBtn").addEventListener("click", cancelOutgoingCall);
document.getElementById("endCallBtn").addEventListener("click", () => {
  sendSignal({ type: "call-end", to: callPeerEmail });
  logCallIfCaller("completed");
  endCall();
});
document.getElementById("muteBtn").addEventListener("click", () => {
  if (!localStream) return;
  micOn = !micOn;
  localStream.getAudioTracks().forEach((t) => (t.enabled = micOn));
  document.getElementById("muteBtn").classList.toggle("off", !micOn);
  document.getElementById("muteBtn").innerHTML = micOn ? ICON.mic : ICON.micOff;
});
document.getElementById("camBtn").addEventListener("click", () => {
  if (!localStream) return;
  camOn = !camOn;
  localStream.getVideoTracks().forEach((t) => (t.enabled = camOn));
  document.getElementById("camBtn").classList.toggle("off", !camOn);
});
document.getElementById("flipCamBtn").addEventListener("click", async () => {
  if (!localStream || !callIsVideo) return;
  currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
  try {
    const newStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: currentFacingMode },
    });
    const newVideoTrack = newStream.getVideoTracks()[0];

    // Swap the outgoing track on the active peer connection
    if (pc) {
      const sender = pc.getSenders().find((s) => s.track && s.track.kind === "video");
      if (sender) await sender.replaceTrack(newVideoTrack);
    }

    // Stop the old video track, keep using the existing audio track
    localStream.getVideoTracks().forEach((t) => t.stop());
    const oldAudioTrack = localStream.getAudioTracks()[0];
    localStream = new MediaStream(oldAudioTrack ? [oldAudioTrack, newVideoTrack] : [newVideoTrack]);
    newVideoTrack.enabled = camOn;

    document.getElementById("localVideo").srcObject = localStream;
  } catch (err) {
    currentFacingMode = currentFacingMode === "user" ? "environment" : "user"; // revert on failure
    console.error("Camera switch failed:", err);
  }
});
document.getElementById("speakerBtn").addEventListener("click", () => {
  speakerOn = !speakerOn;
  const remoteVideo = document.getElementById("remoteVideo");
  remoteVideo.muted = !speakerOn;
  document.getElementById("speakerBtn").classList.toggle("off", !speakerOn);
  document.getElementById("speakerBtn").innerHTML = speakerOn ? ICON.volume : ICON.volumeOff;
});

// Auto-login if a token is already stored
window.addEventListener("load", () => {
  const savedToken = localStorage.getItem("secureChatToken");
  const savedEmail = localStorage.getItem("secureChatEmail");
  const savedUsername = localStorage.getItem("secureChatUsername");
  if (savedToken && savedEmail) {
    token = savedToken;
    myEmail = savedEmail;
    myUsername = savedUsername;
    showList();
    connectSignaling();
    fetchMyProfile();
  }
});
